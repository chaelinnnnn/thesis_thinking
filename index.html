<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6일 기록 업로드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --sub:#777; --line:#e6e6e6; --bg:#fff; --accent:#111; --warn:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Noto Sans KR",system-ui,sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; font-size:14px; }
  header.top { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:22px 28px; font-size:12px; font-weight:700; }
  header.top .logo { font-size:28px; font-weight:300; letter-spacing:.02em; line-height:1; }
  header.top .right { text-align:right; display:flex; justify-content:flex-end; align-items:center; gap:18px; }
  .lang { display:inline-flex; gap:5px; align-items:center; font-size:12px; color:#bbb; }
  .lang button { font-weight:700; color:#bbb; }
  .lang button.on { color:#111; text-decoration:underline; text-underline-offset:3px; }
  .wrap { max-width:640px; margin:0 auto; padding:30px 18px 120px; }
  .intro { text-align:center; font-size:13px; color:var(--sub); margin-bottom:26px; }
  .msg { font-size:12px; min-height:18px; margin-top:6px; }
  .msg.err { color:var(--warn); }
  .hidden { display:none !important; }
  button { font:inherit; cursor:pointer; border:0; background:none; color:inherit; padding:0; }

  /* tilted squares */
  .strips { display:grid; grid-template-columns:repeat(3, 170px); gap:36px 30px; justify-content:center; margin:10px auto 0; }
  .strip { position:relative; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start;
           width:170px; aspect-ratio:1/1; padding:16px; font-size:13px; font-weight:700; text-align:left;
           transform:translateY(var(--y,0)) rotate(var(--r,0deg)); transition:transform .25s ease, outline-color .2s; outline:2px solid transparent; outline-offset:4px; }
  .strip:hover { transform:translateY(var(--y,0)) rotate(0deg); }
  .strip.open { transform:rotate(0deg); outline-color:#111; }
  .strip .big { font-size:30px; font-weight:700; line-height:1; letter-spacing:-.01em; }
  .strip .meta { display:block; font-weight:400; opacity:.8; font-size:12px; margin-top:6px; line-height:1.4; }
  .strip .plus { position:absolute; right:14px; bottom:10px; font-size:22px; font-weight:400; line-height:1; }
  .strip .done { position:absolute; left:16px; bottom:13px; font-weight:400; font-size:11px; }
  @media (max-width:600px){ .strips { grid-template-columns:repeat(2, 42vw); gap:20px 16px; } .strip { width:42vw; } }

  .panel { width:min(600px,94vw); margin:40px auto 0; background:#fff; border:2px solid #111; border-top:14px solid var(--c,#111); padding:20px 20px 22px; }
  .panel h3 { font-size:13px; margin:22px 0 4px; }
  .topic { font-size:19px; font-weight:700; margin:2px 0 4px; }
  .sub { color:var(--sub); font-size:12.5px; }
  label { display:block; font-weight:700; font-size:12.5px; margin:16px 0 6px; }
  .hint { color:var(--sub); font-weight:400; font-size:12px; }
  textarea, input[type=text], input[type=password] { width:100%; font:inherit; font-size:13px; border:0; border-bottom:1px solid #bbb; padding:7px 2px; background:transparent; outline:none; }
  textarea { min-height:52px; resize:vertical; }
  textarea:focus, input:focus { border-bottom-color:var(--ink); }
  input[type=file] { font-size:12px; }
  .scale { display:flex; gap:4px; flex-wrap:wrap; }
  .scale button, .chips button { border:1px solid #ccc; width:34px; height:30px; font-size:12px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button { width:auto; padding:0 12px; }
  .scale button.on, .chips button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .visually-hidden { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none; }
  .drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; margin:0; cursor:pointer;
          min-height:118px; padding:18px; border:2px dashed #111; background:color-mix(in srgb, var(--c,#eee) 18%, #fff);
          transform:rotate(-0.6deg); transition:transform .2s, background .2s; text-align:center; }
  .drop:hover, .drop.over { transform:rotate(0deg); background:color-mix(in srgb, var(--c,#eee) 38%, #fff); }
  .drop.busy { pointer-events:none; opacity:.7; }
  .drop-plus { font-size:30px; font-weight:300; line-height:1; }
  .drop-main { font-size:13px; font-weight:700; }
  .drop-sub { font-size:11.5px; color:var(--sub); font-weight:400; }
  .files { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
  .file { display:flex; align-items:center; gap:10px; border:1px solid #111; padding:7px 10px; font-size:12.5px; background:#fff; }
  .file .ic { width:26px; height:26px; flex:none; display:grid; place-items:center; background:var(--c,#eee); font-size:13px; }
  .file .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file .x { font-size:16px; line-height:1; color:#999; padding:0 2px; }
  .file .x:hover { color:#111; }
  .file a { color:inherit; }
  .progress { height:3px; background:#eee; margin-top:8px; overflow:hidden; }
  .progress > i { display:block; height:100%; width:0; background:#111; transition:width .3s; }
  .question { background:#fff7c2; padding:11px 13px; margin-top:12px; font-size:12.5px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .btn { border:1px solid var(--ink); padding:7px 16px; font-size:12.5px; font-weight:700; background:#fff; }
  .btn.primary { background:var(--ink); color:#fff; }
  .btn:disabled { opacity:.4; cursor:default; }
  .linkbtn { font-size:12px; text-decoration:underline; color:var(--sub); }

  .card { max-width:600px; margin:16px auto; border:2px solid #111; padding:18px 20px; background:#fff; }
  .card h2 { font-size:14px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { border:1px solid #ddd; padding:6px 7px; text-align:left; vertical-align:top; }
  th { font-weight:700; background:#fafafa; }
  .cell { cursor:pointer; }
  .cell.done { background:#e6f5ef; }
  .cell.c { box-shadow: inset 3px 0 0 #f2b25f; }
  .kv div { margin:3px 0; font-size:12.5px; }
  .kv b { color:var(--sub); margin-right:6px; }
  @media (max-width:640px){ header.top { grid-template-columns:1fr; gap:4px; text-align:left; } header.top .right{ justify-content:space-between; } .who{ display:none; } }
</style>
</head>
<body>
<header class="top">
  <div class="logo">6 days</div>
  <div data-i18n="headMid">Thesis study · 생각의 기록</div>
  <div class="right"><span class="lang"><button data-lang="ko">KO</button><span>/</span><button data-lang="en">EN</button></span><span class="who">Chaelin Kim · Pratt MFA Communication Design</span></div>
</header>
<div class="wrap">
  <div class="intro" id="introText">자기 번호를 눌러 그날의 기록과 하루 로그를 올려주세요.</div>
  <div id="status" class="msg" style="text-align:center"></div>

  <div id="login" class="card hidden">
    <h2>관리자 로그인</h2>
    <div class="row"><input type="password" id="keyIn" placeholder="관리자 비밀번호" style="flex:1"><button class="btn primary" id="keyBtn">들어가기</button></div>
    <div class="msg" id="keyMsg"></div>
  </div>

  <div id="pick" class="strips"></div>

  <div id="part" class="hidden">
    <div class="strips" id="days"></div>
    <div style="text-align:center;margin-top:34px"><button class="linkbtn" id="switchBtn" data-i18n="switch">번호 바꾸기</button></div>
  </div>

  <!-- day panel (moved under the open tile) -->
  <div class="panel hidden" id="dayCard">
    <div class="sub" id="dDate"></div>
    <div class="topic" id="dTopic"></div>
    <div class="sub" id="dWayDesc"></div>

    <label><span data-i18n="upload">기록 올리기</span> <span class="hint" data-i18n="uploadHint">수첩 사진, 녹음, 메모 캡처. 여러 개 가능</span></label>
    <input type="file" id="fileIn" multiple accept="image/*,video/*,audio/*,application/pdf,text/plain" class="visually-hidden">
    <label for="fileIn" class="drop" id="drop">
      <span class="drop-plus">+</span>
      <span class="drop-main" data-i18n="dropMain">눌러서 고르거나 여기로 끌어다 놓기</span>
      <span class="drop-sub" data-i18n="dropSub">사진 · 녹음 · 영상 · PDF</span>
    </label>
    <div class="msg" id="fileMsg"></div>
    <div class="files" id="fileList"></div>

    <div id="qBox" class="question hidden">
      <div class="hint" data-i18n="qFrom">오늘의 질문</div>
      <div id="qText" style="font-weight:700;font-size:15px;margin-top:2px"></div>
    </div>
    <div id="qWait" class="question hidden">
      <div style="font-weight:700" data-i18n="askLabel">기록을 올린 뒤, 기록에서 눈에 띄는 단어 2~3개를 적어주세요</div>
      <div class="row" style="margin-top:6px;flex-wrap:nowrap"><input type="text" id="askIn" data-i18n-ph="askPh" placeholder="예: 창고, 할머니, 겨울" style="flex:1"><button class="btn primary" id="askBtn" data-i18n="askBtn">질문 받기</button></div>
      <div class="msg" id="askMsg"></div>
    </div>

    <h3 data-i18n="logTitle">하루 로그 (5분)</h3>
    <label><span data-i18n="q1">1. 포착: 떠오른 생각을 놓치지 않고 기록할 수 있었나요?</span> <span class="hint" data-i18n="scaleHint">1 전혀 아니다 · 7 매우 그렇다</span></label>
    <div class="scale" data-k="capture"></div>

    <label data-i18n="q2">2. 이어감: 기록한 뒤 생각이 더 이어졌나요, 기록하는 동작 때문에 끊겼나요?</label>
    <div class="scale" data-k="continuation"></div>

    <div id="toolQs"></div>

    <div class="row" style="margin-top:20px">
      <span class="msg" id="saveMsg"></span>
      <button class="btn primary" id="saveBtn" data-i18n="save">저장하기</button>
    </div>
  </div>

  <div id="admin" class="hidden">
    <div class="card" style="max-width:860px">
      <div class="row"><h2>전체 현황</h2><div><button class="btn" id="reloadAll">새로고침</button> <button class="btn" id="copyCsv">CSV 복사</button></div></div>
      <div class="sub">칸을 누르면 아래에 자세한 내용이 나와요. 주황 줄은 수첩 + 질문 날이에요.</div>
      <div style="overflow-x:auto;margin-top:10px"><table id="grid"></table></div>
      <div class="msg" id="csvMsg"></div>
    </div>
    <div class="card hidden" id="detail" style="max-width:860px"></div>
  </div>
</div>

const TILT = [[-3,0],[2.5,10],[-1.5,-4],[3,6],[-2.5,4],[1.8,0],[-2,4],[2.2,-4]];
function styleStrip(el,i,color){ el.style.background=color; el.style.setProperty("--r",TILT[i%TILT.length][0]+"deg"); el.style.setProperty("--y",TILT[i%TILT.length][1]+"px"); }

// day 1 → 6 gets deeper within the participant's own color
function hexToHsl(hex){ const n=parseInt(hex.slice(1),16); let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,sat=0,l=(mx+mn)/2;
  if (mx!==mn){ const d=mx-mn; sat=l>.5?d/(2-mx-mn):d/(mx+mn); h= mx===r?(g-b)/d+(g<b?6:0) : mx===g?(b-r)/d+2 : (r-g)/d+4; h*=60; }
  return [h, sat*100, l*100]; }
function dayShade(hex, d){ const [h,sat,l]=hexToHsl(hex); const L=Math.max(22, Math.min(90, l+20-d*9)); const S=Math.min(100, sat+d*4); return `hsl(${h.toFixed(0)} ${S.toFixed(0)}% ${L.toFixed(0)}%)`; }
function dayInk(hex, d){
  const [h,sat,l]=hexToHsl(hex); const L=Math.max(22, Math.min(90, l+20-d*9))/100, S=Math.min(100, sat+d*4)/100;
  const k=n=>(n+h/30)%12, a=S*Math.min(L,1-L), f=n=>L-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  const lin=c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);
  const Y=.2126*lin(f(0))+.7152*lin(f(8))+.0722*lin(f(4));
  return Y < 0.22 ? "#fff" : "#111"; }

// shrink big photos before upload so phones upload quickly
function shrinkImage(file){
  return new Promise(res=>{
    if (!file.type.startsWith("image/") || file.type==="image/gif") return res(file);
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1800, sc=Math.min(1, max/Math.max(img.width,img.height));
      if (sc===1 && file.size<2.5e6){ URL.revokeObjectURL(url); return res(file); }
      const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>res(b?new File([b], file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file),"image/jpeg",0.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}
function toBase64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); }); }

async function uploadFiles(files){

  $("#fileMsg").className="msg";
  let bar=document.querySelector(".progress"); if (!bar){ bar=document.createElement("div"); bar.className="progress"; bar.innerHTML="<i></i>"; $("#fileMsg").before(bar); }
  bar.firstChild.style.width="4%";
  for (let i=0;i<files.length;i++){
    const raw=files[i];
    $("#fileMsg").textContent = t("uploadingN")(i+1, files.length) + " · " + raw.name;
    try {
      const f = await shrinkImage(raw);
      if (f.size > 25e6) throw new Error(t("tooBig"));
      const r = await api({ action:"upload", pid, day:day+1, name:f.name, mime:f.type, base64: await toBase64(f) });

      bar.firstChild.style.width = Math.round((i+1)/files.length*100)+"%";
    } catch(err){ $("#fileMsg").className="msg err"; $("#fileMsg").textContent = t("uploadFail")(raw.name)+err.message; drop.classList.remove("busy"); bar.remove(); return; }
  }
  $("#fileMsg").textContent=t("uploaded");

  drop.classList.remove("busy");
  await save(true);
}

function renderDetail(){
  const box=$("#detail");
  if (!selected){ box.classList.add("hidden"); return; }
  box.classList.remove("hidden"); box.innerHTML="";
  const [p,dd]=selected.split("_d"); const d=+dd-1; const w=wayOf(p,d); const e=entries[selected]; const q=questions[selected];
  const h=document.createElement("h2"); h.textContent=`${p} · ${d+1}일차 · ${WAY[w].name}`; box.appendChild(h);
  const sub=document.createElement("div"); sub.className="sub"; sub.textContent=TOPICS[d]+(e?" · 저장 "+new Date(e.updatedAt).toLocaleString("ko-KR"):" · 아직 기록 없음"); box.appendChild(sub);
  if (e){
    const fl=document.createElement("div"); fl.className="files"; (e.files||[]).forEach(f=>fl.appendChild(fileEl(f,true))); box.appendChild(fl);
    const kv=document.createElement("div"); kv.className="kv"; kv.style.marginTop="12px";
    LOGKEYS.forEach(([k,lab])=>{ const v=e.log&&e.log[k]; if(v===undefined||v==="") return; const r=document.createElement("div"); const b=document.createElement("b"); b.textContent=lab; r.appendChild(b); r.appendChild(document.createTextNode(String(v))); kv.appendChild(r); });
    box.appendChild(kv);
  }
  if (w==="C"){
    const lab=document.createElement("label"); lab.textContent="되묻는 질문 (단어 하나, 짧게, 새 내용 없이)"; box.appendChild(lab);
    const inp=document.createElement("input"); inp.type="text"; inp.value=(q&&q.text)||""; inp.placeholder="예: [단어]는 어떤 거예요?"; box.appendChild(inp);
    const word=document.createElement("input"); word.type="text"; word.value=(q&&q.word)||""; word.placeholder="고른 단어"; word.style.marginTop="6px"; box.appendChild(word);
    const row=document.createElement("div"); row.className="row"; row.style.marginTop="10px";
    const m=document.createElement("span"); m.className="msg";
    const b=document.createElement("button"); b.className="btn primary"; b.textContent="질문 보내기";
    b.onclick=async()=>{ b.disabled=true; try{ await api({action:"question", key:adminKey, id:selected, text:inp.value.trim(), word:word.value.trim()}); questions[selected]={id:selected,text:inp.value.trim(),word:word.value.trim()}; m.textContent="보냈어요. 참가자가 '질문 확인하기'를 누르면 보여요."; renderAdmin(); }catch(err){ m.className="msg err"; m.textContent="보내지 못했어요: "+err.message; } b.disabled=false; };
    row.appendChild(m); row.appendChild(b); box.appendChild(row);
  }
}
function csvCell(v){ const s=(v===undefined||v===null)?"":String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
$("#copyCsv").onclick=async()=>{
  const cols=["pid","day","date","way","topic","files",...LOGKEYS.map(k=>k[0]),"question","questionWord","updatedAt"];
  const lines=[cols.join(",")];
  PIDS.forEach(p=>DATES.forEach((_,d)=>{ const id=docId(p,d), e=entries[id]; if(!e) return; const q=questions[id]||{};
    lines.push([p,d+1,DATES[d],wayOf(p,d),TOPICS[d],(e.files||[]).map(f=>f.name).join(" | "),...LOGKEYS.map(k=>e.log&&e.log[k[0]]),q.text,q.word,e.updatedAt].map(csvCell).join(",")); }));
  try{ await navigator.clipboard.writeText(lines.join("\n")); $("#csvMsg").textContent="복사했어요. 스프레드시트에 붙여넣으면 돼요."; }
  catch(e){ $("#csvMsg").textContent="복사하지 못했어요. 같은 데이터가 Google 시트에도 있어요."; }
};

// ---------- language ----------
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{
  LANG=b.dataset.lang; try{ localStorage.setItem("lang",LANG);}catch(e){}
  applyLang();
  if (!$("#pick").classList.contains("hidden")) $("#introText").textContent=t("introPick");
  if (pid && !$("#part").classList.contains("hidden")){ renderPart(false); if (openDay!==null) renderToolQs(wayOf(pid,day)); }
});
applyLang(); $("#introText").textContent=t("introPick");

// ---------- boot ----------
(async ()=>{
  if (location.hash==="#admin"){ const k=load("akey"); if (k){ adminKey=k; await loadAll(); } else showLogin(); return; }
  const saved=load("pid");
  if (saved && ORDER[saved]){ pid=saved; day=todayIdx(); openDay=day; showPart(); await loadMine(true); }
})();
</script>
